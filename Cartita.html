<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Cartita para mi chico bonito~♡!</title>
    <link rel="stylesheet" href="Carta.css">
</head>

<body>

    <h1>¡Es una cartita!</h1>

    <div class="fotitos">
        <div class="estrella-izquierda">
            <img src="starizq.png" alt="Estrellitas y brillitos" width="250" height="250"> 
        </div>

        <div class="Rodimus">
            <figure>
                <img src="rodimus.png" alt="RODIMUS!!!" width="250" height="200"> 
                <figcaption>Como capitán de la Lost Light<br>¡Te deseo un pumpe muy divertido!</figcaption>
            </figure>
        </div>

        <div class="estrella-derecha">
            <img src="starder.png" alt="Estrellitas y brillitos" width="250" height="250"> 
        </div>
    </div>

    <!-- Botón con un ID para controlarlo desde JavaScript -->
    <div class="bm">
        <button id="playBtn">MUACK~♡</button>
    </div>

    <br><br>

    <div class="carta">
        <img src="cartita.jpeg" alt="Cartita para mi amorcito">
    </div>

    <div class="Conjux">
        <figure>
            <img src="skystar.png" alt="Skystar" width="250" height="200"> 
            <figcaption>Para mi Conjux Endura: <br> ¡Te amo desde aquí <br> hasta Cybertron!</figcaption>
        </figure>
    </div>

    <!-- Incluimos el script al final -->
    <script src="Carta.js"></script>
</body>
</html>
